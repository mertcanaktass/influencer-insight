spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

openai.api.key=${OPENAI_API_KEY}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

jwt.secret=${JWT_SECRET}
jwt.access-token.expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}

google.youtube.client-id=${GOOGLE_YOUTUBE_CLIENT_ID}
google.youtube.client-secret=${GOOGLE_YOUTUBE_CLIENT_SECRET}
google.youtube.redirect-uri=${GOOGLE_YOUTUBE_REDIRECT_URI}
google.youtube.scopes=${GOOGLE_YOUTUBE_SCOPES:https://www.googleapis.com/auth/youtube.readonly,https://www.googleapis.com/auth/yt-analytics.readonly}

instagram.client-id=${INSTAGRAM_CLIENT_ID}
instagram.client-secret=${INSTAGRAM_CLIENT_SECRET}
instagram.redirect-uri=${INSTAGRAM_REDIRECT_URI}
instagram.scopes=${INSTAGRAM_SCOPES:public_profile,instagram_basic,instagram_manage_insights,pages_read_engagement,pages_show_list,instagram_manage_comments}

tiktok.client-key=${TIKTOK_CLIENT_KEY}
tiktok.client-secret=${TIKTOK_CLIENT_SECRET}
tiktok.base-url=${TIKTOK_BASE_URL:https://open.tiktokapis.com}
tiktok.auth-base-url=${TIKTOK_AUTH_BASE_URL:https://www.tiktok.com}
tiktok.redirect-uri=${TIKTOK_REDIRECT_URI}
tiktok.token-refresh-window-minutes=${TIKTOK_TOKEN_REFRESH_WINDOW_MINUTES:5}
tiktok.scopes=${TIKTOK_SCOPES:user.info.basic,user.info.profile,video.list,video.upload,video.publish}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.social-token-encryption-key=${SOCIAL_TOKEN_ENCRYPTION_KEY}
logging.level.com.deneme.influencerinsight=INFO
