spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/influencerdb}
spring.datasource.username=${DATABASE_USERNAME:dev}
spring.datasource.password=${DATABASE_PASSWORD:dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

openai.api.key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

jwt.secret=${JWT_SECRET:RkFLRV9TRUNSRVRfS0VZX1RPS19CRV9SRUxBQ0VEX1NFQ1VSRQ==}
jwt.access-token.expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}

google.youtube.client-id=${GOOGLE_YOUTUBE_CLIENT_ID:}
google.youtube.client-secret=${GOOGLE_YOUTUBE_CLIENT_SECRET:}
google.youtube.redirect-uri=${GOOGLE_YOUTUBE_REDIRECT_URI:http://localhost:8080/api/youtube/oauth/callback}
google.youtube.scopes=https://www.googleapis.com/auth/youtube.readonly,https://www.googleapis.com/auth/yt-analytics.readonly

instagram.client-id=${INSTAGRAM_CLIENT_ID:}
instagram.client-secret=${INSTAGRAM_CLIENT_SECRET:}
instagram.redirect-uri=${INSTAGRAM_REDIRECT_URI:http://localhost:8080/api/instagram/oauth/callback}
instagram.scopes=public_profile,instagram_basic,instagram_manage_insights,pages_read_engagement,pages_show_list,instagram_manage_comments

tiktok.client-key=${TIKTOK_CLIENT_KEY:}
tiktok.client-secret=${TIKTOK_CLIENT_SECRET:}
tiktok.base-url=https://open.tiktokapis.com
tiktok.auth-base-url=https://www.tiktok.com
tiktok.redirect-uri=${TIKTOK_REDIRECT_URI:http://localhost:8080/api/tiktok/oauth/callback}
tiktok.token-refresh-window-minutes=${TIKTOK_TOKEN_REFRESH_WINDOW_MINUTES:5}
tiktok.scopes=user.info.basic,user.info.profile,video.list,video.upload,video.publish

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.social-token-encryption-key=${SOCIAL_TOKEN_ENCRYPTION_KEY:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
logging.level.com.deneme.influencerinsight=DEBUG
