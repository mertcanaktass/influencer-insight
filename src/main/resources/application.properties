spring.application.name=influencer-insight
spring.profiles.default=local

server.port=${SERVER_PORT:8080}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.oauth.state-ttl-seconds=${OAUTH_STATE_TTL_SECONDS:600}
auth.refresh-token.ttl-seconds=${REFRESH_TOKEN_TTL_SECONDS:604800}
app.http.connect-timeout-ms=${HTTP_CONNECT_TIMEOUT_MS:5000}
app.http.read-timeout-ms=${HTTP_READ_TIMEOUT_MS:15000}
app.ai.analysis.max-requests-per-window=${AI_ANALYSIS_MAX_REQUESTS:10}
app.ai.analysis.window-seconds=${AI_ANALYSIS_WINDOW_SECONDS:3600}
app.email.verification-token-ttl-seconds=${EMAIL_VERIFICATION_TOKEN_TTL_SECONDS:86400}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.email.verification-base-url=${EMAIL_VERIFICATION_BASE_URL:http://localhost:3000/verify-email}
app.maintenance.cleanup-delay-ms=${MAINTENANCE_CLEANUP_DELAY_MS:3600000}
app.social.snapshot.retention-days=${SOCIAL_SNAPSHOT_RETENTION_DAYS:90}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
